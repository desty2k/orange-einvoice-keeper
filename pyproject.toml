[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "orange-einvoice-keeper"
version = "0.1.0"
description = "Persistent, self-scheduling Orange e-invoice login automation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Orange e-Invoice Keeper contributors"}]
dependencies = [
  "email-validator==2.2.0",
  "httpx==0.28.1",
  "playwright==1.52.0",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "typer==0.16.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.16.0",
  "pytest==8.4.0",
  "pytest-asyncio==1.0.0",
  "ruff==0.11.13",
]

[project.scripts]
orange-einvoice = "orange_einvoice.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orange_einvoice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["tests"]
