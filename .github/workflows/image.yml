name: publish-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-image-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      minor_tag: ${{ steps.version.outputs.minor_tag }}
      major_tag: ${{ steps.version.outputs.major_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: python3 scripts/semantic_version.py

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orange-einvoice-keeper:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/orange-einvoice-keeper:${{ needs.version.outputs.minor_tag }}
            ghcr.io/${{ github.repository_owner }}/orange-einvoice-keeper:${{ needs.version.outputs.major_tag }}
            ghcr.io/${{ github.repository_owner }}/orange-einvoice-keeper:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - name: Create immutable source tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"
